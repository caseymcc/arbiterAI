name: Release Major/Minor

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
    - name: Checkout source branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Calculate new version and branch
      id: version
      run: |
        chmod +x ./scripts/version.sh
        CURRENT=$(./scripts/version.sh get)
        IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT}"

        if [ "${{ inputs.release_type }}" = "major" ]; then
          NEW_MAJOR=$((MAJOR+1))
          NEW_MINOR=0
          NEW_VERSION="${NEW_MAJOR}.0.0"
          BRANCH="release/${NEW_MAJOR}.0"
        else
          NEW_MINOR=$((MINOR+1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          BRANCH="release/${MAJOR}.${NEW_MINOR}"
        fi

        echo "current=${CURRENT}" >> $GITHUB_OUTPUT
        echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
        echo "Release type: ${{ inputs.release_type }}"
        echo "Current version: ${CURRENT}"
        echo "New version: ${NEW_VERSION}"
        echo "Branch: ${BRANCH}"

    - name: Create release branch
      run: |
        git checkout -b "${{ steps.version.outputs.branch }}"

    - name: Set version on release branch
      run: |
        ./scripts/version.sh set "${{ steps.version.outputs.new_version }}"

    - name: Commit version bump
      run: |
        git add CMakeLists.txt
        git commit -m "release: v${{ steps.version.outputs.new_version }}"

    - name: Create tag
      id: tag
      run: |
        # Annotated, pushed by name and given to the release as its target, so the
        # tag sits on this commit and not on whatever the branch tip is by release time.
        git tag -a "v${{ steps.version.outputs.new_version }}" -m "v${{ steps.version.outputs.new_version }}"
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    # --- Build artifacts ---

    - name: Extract Docker version
      id: docker_version
      run: |
        VERSION=$(grep -oP '(?<=^ARG DOCKER_VERSION=)[0-9]+\.[0-9]+\.[0-9]+' docker/Dockerfile)
        echo "DOCKER_VERSION=$VERSION" >> $GITHUB_OUTPUT
        REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "REPO_LC=$REPO_LC" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ghcr.io/${{ steps.docker_version.outputs.REPO_LC }}
          arbiterai-dev
        tags: |
          type=raw,value=${{ steps.docker_version.outputs.DOCKER_VERSION }}

    - name: Build and cache Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/Dockerfile
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=ghcr.io/${{ steps.docker_version.outputs.REPO_LC }}:${{ steps.docker_version.outputs.DOCKER_VERSION }}
        cache-to: type=inline

    - name: Create cache directories
      run: |
        mkdir -p models
        mkdir -p vcpkg_cache

    - name: Cache vcpkg
      uses: actions/cache@v3
      with:
        path: vcpkg_cache
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'src/dashboard/vcpkg*.json', 'src/dashboard/ports/**') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Build project
      run: ./runDocker.sh --ci ./build.sh release
      env:
        VCPKG_CACHE_PATH: ${{ github.workspace }}/vcpkg_cache

    # --- Package library ---

    - name: Package library
      id: package_lib
      run: |
        VERSION="${{ steps.version.outputs.new_version }}"
        LIB_DIR="arbiterAI-lib-v${VERSION}-linux-x64"

        mkdir -p "${LIB_DIR}/lib"
        mkdir -p "${LIB_DIR}/include/arbiterAI"
        mkdir -p "${LIB_DIR}/lib/cmake/arbiterAI"
        mkdir -p "${LIB_DIR}/share/arbiterAI/schemas"

        # Static library
        cp build/linux_x64_release/libarbiterai.a "${LIB_DIR}/lib/"

        # Public headers
        for header in src/arbiterAI/*.h; do
          cp "$header" "${LIB_DIR}/include/arbiterAI/"
        done
        cp build/linux_x64_release/generated/arbiterAI/version.h "${LIB_DIR}/include/arbiterAI/"

        # CMake package config
        cp build/linux_x64_release/cmake/arbiterAIConfig.cmake "${LIB_DIR}/lib/cmake/arbiterAI/" 2>/dev/null || true
        cp build/linux_x64_release/cmake/arbiterAIConfigVersion.cmake "${LIB_DIR}/lib/cmake/arbiterAI/" 2>/dev/null || true

        # JSON schema
        cp schemas/model_config.schema.json "${LIB_DIR}/share/arbiterAI/schemas/"

        cp LICENSE "${LIB_DIR}/"

        LIB_TARBALL="arbiterAI-lib-v${VERSION}-linux-x64.tar.gz"
        tar -czf "${LIB_TARBALL}" "${LIB_DIR}"
        echo "tarball=${LIB_TARBALL}" >> $GITHUB_OUTPUT

    # --- Package server ---

    - name: Package server
      id: package_server
      run: |
        VERSION="${{ steps.version.outputs.new_version }}"
        ./runDocker.sh --ci ./scripts/packageServer.sh build/linux_x64_release "${VERSION}" dist
        echo "tarball=dist/arbiterAI-server-v${VERSION}-linux-x64.tar.gz" >> $GITHUB_OUTPUT

    # --- Server image (ghcr.io/<owner>/arbiterai-server, separate from the build image) ---

    - name: Build and check the server image
      id: server_image
      run: |
        VERSION="${{ steps.version.outputs.new_version }}"
        OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="ghcr.io/${OWNER_LC}/arbiterai-server"
        docker build -f docker/server.Dockerfile --build-arg VERSION="${VERSION}" -t "${IMAGE}:v${VERSION}" dist
        ./scripts/checkServerImage.sh "${IMAGE}:v${VERSION}" "${VERSION}"
        echo "image=${IMAGE}" >> $GITHUB_OUTPUT

    # Pushed only once the build and the image check have passed, so a failed run
    # leaves no release branch or tag behind and can be re-run.
    - name: Push branch and tag
      run: |
        git push --atomic origin "${{ steps.version.outputs.branch }}" "refs/tags/v${{ steps.version.outputs.new_version }}"

    - name: Push the server image
      run: |
        VERSION="${{ steps.version.outputs.new_version }}"
        IMAGE="${{ steps.server_image.outputs.image }}"
        docker push "${IMAGE}:v${VERSION}"
        # :latest only for the highest release, not a patch on an older release line.
        HIGHEST=$(git tag -l 'v*' | sort -V | tail -n1)
        if [ "${HIGHEST}" = "v${VERSION}" ]; then
          docker tag "${IMAGE}:v${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
        else
          echo "v${VERSION} is not the highest release (${HIGHEST}); not moving :latest"
        fi

    # --- Create release ---

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.version.outputs.new_version }}"
        target_commitish: ${{ steps.tag.outputs.sha }}
        name: "v${{ steps.version.outputs.new_version }}"
        generate_release_notes: true
        body: |
          ### Packages

          | Package | Description |
          |---------|-------------|
          | `arbiterAI-lib-v${{ steps.version.outputs.new_version }}-linux-x64.tar.gz` | Library, headers, and CMake config for linking |
          | `arbiterAI-server-v${{ steps.version.outputs.new_version }}-linux-x64.tar.gz` | Standalone server: stripped release binary, install marker, systemd unit, compose file, README |

          ### Server

          The server tarball is a stripped release build for Linux x86-64 (glibc 2.38+: Ubuntu 24.04+, Debian 13+).
          Its `README.md` covers the requirements, the configuration file and the command line:
          ```bash
          tar -xzf arbiterAI-server-v${{ steps.version.outputs.new_version }}-linux-x64.tar.gz
          mkdir -p ~/arbiterAI && cd ~/arbiterAI    # a data directory, with your server.json in it
          /path/to/arbiterAI-server-v${{ steps.version.outputs.new_version }}-linux-x64/bin/arbiterAI-server -c server.json
          ```

          Docker: `ghcr.io/${{ github.repository_owner }}/arbiterai-server:v${{ steps.version.outputs.new_version }}` (see the README's "Running under Docker").
        draft: false
        prerelease: false
        files: |
          ${{ steps.package_lib.outputs.tarball }}
          ${{ steps.package_server.outputs.tarball }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
