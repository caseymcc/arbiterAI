name: Point Release

on:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  point-release:
    runs-on: ubuntu-latest
    # Skip if this push was made by the bot (version bump commit)
    if: github.actor != 'github-actions[bot]'
    # Serialize releases of a branch, so two pushes cannot tag the same version.
    concurrency:
      group: point-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
    # Check out the branch tip, not the pushed commit: a run queued behind
    # another release then starts from that release's bump commit and tag.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

    # Release when the push brings merged PRs since the last v* tag, whether
    # or not its head commit is one of them.
    - name: Find PRs merged since the last release
      id: merged_prs
      uses: actions/github-script@v7
      with:
        script: |
          const mergedPrsSinceTag = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/mergedPrsSinceTag.js`);
          await mergedPrsSinceTag({github, context, core});

    - name: Configure Git
      if: steps.merged_prs.outputs.should_release == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Bump patch version
      if: steps.merged_prs.outputs.should_release == 'true'
      id: bump
      run: |
        chmod +x ./scripts/version.sh
        OLD_VERSION=$(./scripts/version.sh get)
        NEW_VERSION=$(./scripts/version.sh bump patch)
        echo "old_version=${OLD_VERSION}" >> $GITHUB_OUTPUT
        echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "Bumped version: ${OLD_VERSION} → ${NEW_VERSION}"

    - name: Commit version bump
      if: steps.merged_prs.outputs.should_release == 'true'
      run: |
        git add CMakeLists.txt
        git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"

    - name: Create tag
      if: steps.merged_prs.outputs.should_release == 'true'
      run: |
        git tag "v${{ steps.bump.outputs.new_version }}"

    - name: Push commit and tag
      if: steps.merged_prs.outputs.should_release == 'true'
      run: |
        git push origin HEAD --follow-tags

    # --- Build ---

    - name: Extract Docker version
      if: steps.merged_prs.outputs.should_release == 'true'
      id: docker_version
      run: |
        VERSION=$(grep -oP '(?<=^ARG DOCKER_VERSION=)[0-9]+\.[0-9]+\.[0-9]+' docker/Dockerfile)
        echo "DOCKER_VERSION=$VERSION" >> $GITHUB_OUTPUT
        REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "REPO_LC=$REPO_LC" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      if: steps.merged_prs.outputs.should_release == 'true'
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      if: steps.merged_prs.outputs.should_release == 'true'
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ghcr.io/${{ steps.docker_version.outputs.REPO_LC }}
          arbiterai-dev
        tags: |
          type=raw,value=${{ steps.docker_version.outputs.DOCKER_VERSION }}

    - name: Build and cache Docker image
      if: steps.merged_prs.outputs.should_release == 'true'
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/Dockerfile
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=ghcr.io/${{ steps.docker_version.outputs.REPO_LC }}:${{ steps.docker_version.outputs.DOCKER_VERSION }}
        cache-to: type=inline

    - name: Create cache directories
      if: steps.merged_prs.outputs.should_release == 'true'
      run: |
        mkdir -p models
        mkdir -p vcpkg_cache

    - name: Cache vcpkg
      if: steps.merged_prs.outputs.should_release == 'true'
      uses: actions/cache@v3
      with:
        path: vcpkg_cache
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'src/dashboard/vcpkg*.json', 'src/dashboard/ports/**') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Build project
      if: steps.merged_prs.outputs.should_release == 'true'
      run: ./runDocker.sh --ci ./build.sh release
      env:
        VCPKG_CACHE_PATH: ${{ github.workspace }}/vcpkg_cache

    # --- Package library ---

    - name: Package library
      if: steps.merged_prs.outputs.should_release == 'true'
      id: package_lib
      run: |
        VERSION="${{ steps.bump.outputs.new_version }}"
        LIB_DIR="arbiterAI-lib-v${VERSION}-linux-x64"

        mkdir -p "${LIB_DIR}/lib"
        mkdir -p "${LIB_DIR}/include/arbiterAI"
        mkdir -p "${LIB_DIR}/lib/cmake/arbiterAI"
        mkdir -p "${LIB_DIR}/share/arbiterAI/schemas"

        # Static library
        cp build/linux_x64_release/libarbiterai.a "${LIB_DIR}/lib/"

        # Public headers
        for header in src/arbiterAI/*.h; do
          cp "$header" "${LIB_DIR}/include/arbiterAI/"
        done
        cp build/linux_x64_release/generated/arbiterAI/version.h "${LIB_DIR}/include/arbiterAI/"

        # CMake package config
        cp build/linux_x64_release/cmake/arbiterAIConfig.cmake "${LIB_DIR}/lib/cmake/arbiterAI/" 2>/dev/null || true
        cp build/linux_x64_release/cmake/arbiterAIConfigVersion.cmake "${LIB_DIR}/lib/cmake/arbiterAI/" 2>/dev/null || true

        # JSON schema
        cp schemas/model_config.schema.json "${LIB_DIR}/share/arbiterAI/schemas/"

        cp LICENSE "${LIB_DIR}/"

        LIB_TARBALL="arbiterAI-lib-v${VERSION}-linux-x64.tar.gz"
        tar -czf "${LIB_TARBALL}" "${LIB_DIR}"
        echo "tarball=${LIB_TARBALL}" >> $GITHUB_OUTPUT

    # --- Package server ---

    - name: Package server
      if: steps.merged_prs.outputs.should_release == 'true'
      id: package_server
      run: |
        VERSION="${{ steps.bump.outputs.new_version }}"
        ./runDocker.sh --ci ./scripts/packageServer.sh build/linux_x64_release "${VERSION}" dist
        echo "tarball=dist/arbiterAI-server-v${VERSION}-linux-x64.tar.gz" >> $GITHUB_OUTPUT

    # --- Server image (ghcr.io/<owner>/arbiterai-server, separate from the build image) ---

    - name: Build and check the server image
      if: steps.merged_prs.outputs.should_release == 'true'
      id: server_image
      run: |
        VERSION="${{ steps.bump.outputs.new_version }}"
        OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="ghcr.io/${OWNER_LC}/arbiterai-server"
        docker build -f docker/server.Dockerfile --build-arg VERSION="${VERSION}" -t "${IMAGE}:v${VERSION}" dist
        ./scripts/checkServerImage.sh "${IMAGE}:v${VERSION}" "${VERSION}"
        echo "image=${IMAGE}" >> $GITHUB_OUTPUT

    - name: Push the server image
      if: steps.merged_prs.outputs.should_release == 'true'
      run: |
        VERSION="${{ steps.bump.outputs.new_version }}"
        IMAGE="${{ steps.server_image.outputs.image }}"
        docker push "${IMAGE}:v${VERSION}"
        # :latest only for the highest release, not a patch on an older release line.
        HIGHEST=$(git tag -l 'v*' | sort -V | tail -n1)
        if [ "${HIGHEST}" = "v${VERSION}" ]; then
          docker tag "${IMAGE}:v${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
        else
          echo "v${VERSION} is not the highest release (${HIGHEST}); not moving :latest"
        fi

    # --- Create release ---

    - name: Create GitHub Release
      if: steps.merged_prs.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.bump.outputs.new_version }}"
        name: "v${{ steps.bump.outputs.new_version }}"
        body: |
          Point release with ${{ steps.merged_prs.outputs.pr_count }} pull request(s) merged since ${{ steps.merged_prs.outputs.last_tag }}:

          ${{ steps.merged_prs.outputs.pr_list }}

          ### Packages

          | Package | Description |
          |---------|-------------|
          | `arbiterAI-lib-v${{ steps.bump.outputs.new_version }}-linux-x64.tar.gz` | Library, headers, and CMake config for linking |
          | `arbiterAI-server-v${{ steps.bump.outputs.new_version }}-linux-x64.tar.gz` | Standalone server: stripped release binary, install marker, systemd unit, compose file, README |

          ### Server

          The server tarball is a stripped release build for Linux x86-64 (glibc 2.38+: Ubuntu 24.04+, Debian 13+).
          Its `README.md` covers the requirements, the configuration file and the command line:
          ```bash
          tar -xzf arbiterAI-server-v${{ steps.bump.outputs.new_version }}-linux-x64.tar.gz
          ./arbiterAI-server-v${{ steps.bump.outputs.new_version }}-linux-x64/bin/arbiterAI-server --self-test -c server.json
          ./arbiterAI-server-v${{ steps.bump.outputs.new_version }}-linux-x64/bin/arbiterAI-server -c server.json
          ```

          Docker: `ghcr.io/${{ github.repository_owner }}/arbiterai-server:v${{ steps.bump.outputs.new_version }}` (see the README's "Running under Docker").
        draft: false
        prerelease: false
        files: |
          ${{ steps.package_lib.outputs.tarball }}
          ${{ steps.package_server.outputs.tarball }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
